name: Release

# Tag a version to cut a release:  git tag v0.1.0 && git push origin v0.1.0
# Builds per-platform binaries and publishes them as `lofty-<target>.tar.gz`,
# which is exactly the asset name `lofty self-update` looks for on the latest
# release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            linker: gcc-aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: install cross linker
        if: matrix.linker != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.linker }}
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        run: |
          tar -czf "lofty-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" lofty
          shasum -a 256 "lofty-${{ matrix.target }}.tar.gz" > "lofty-${{ matrix.target }}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: lofty-${{ matrix.target }}
          path: lofty-${{ matrix.target }}.tar.gz*

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          # Non-draft, non-prerelease so `self-update` (releases/latest) finds it.
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
